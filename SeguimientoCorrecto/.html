<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modal de Alerta</title>

    <style>

        .modal-overlay {

            position: fixed;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

            background-color: rgba(0, 0, 0, 0.5);

            display: flex;

            justify-content: center;

            align-items: center;

            z-index: 1000;

        }



        .modal-content {

            background-color: #ffffff;

            padding: 25px;

            border-radius: 8px;

            width: 90%;

            max-width: 400px;

            text-align: center;

            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);

            font-family: Arial, sans-serif;

        }



        .modal-content p {

            font-size: 16px;

            color: #333333;

            margin-bottom: 20px;

        }



        .modal-btn {

            background-color: #e74c3c;

            color: white;

            border: none;

            padding: 10px 20px;

            font-size: 14px;

            border-radius: 4px;

            cursor: pointer;

        }



        .modal-btn:hover {

            background-color: #c0392b;

        }

    </style>

</head>

<body>



    <div id="miModal" class="modal-overlay">

        <div class="modal-content">

            <p>Usuario no apto para asignar</p>

            <button class="modal-btn" onclick="cerrarModal()">Aceptar</button>

        </div>

    </div>



    <script>

        function cerrarModal() {

            document.getElementById('miModal').style.display = 'none';

        }

    </script>



</body>

</html>
